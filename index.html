<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Another InstaPost</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    </head>
<body>
    <div class="post">
        <div class="postHead">
            <div class="user">
                <img src="/IMG_20260516_224044.jpg">
                <div>
                    <h4>4rthReiss</h4>
                    <h5>Para 4Geeks</h5> 
                </div>                  
            </div>
            <div class="options">
                <h4 class="Date">1m ago</h4>
                <i class="fa-solid fa-ellipsis-vertical"></i>
            </div>
        </div>
        <div class="postBody">
            <img src="/IMG_20260516_224046.jpg" solid>
            <div class="interact">
                <div class="icon">
                    <i class="fa-regular fa-heart"></i>  
                    <i class="fa-regular fa-comment"></i>
                    <i class="fa-solid fa-retweet"></i>
                    <i class="fa-regular fa-paper-plane"></i>
                </div>
                <div>
                    <i class="fa-regular fa-bookmark"></i>
                </div>
            </div>
            <div class="textSquare">
                <p id="textPost">Un recuerdo de cuando fui al concierto de rawayana, espectacular. <strong id="hashtag">#4GeeksAcademy</strong></p>
            </div>
        </div>
    </div>    
</body>
</html>
